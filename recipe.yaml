# rattler-build recipe, modular-community shape.
# Build locally: rattler-build build -r recipe.yaml -c https://conda.modular.com/max -c https://prefix.dev/amarbaro/amarbaro -c conda-forge
context:
  version: 0.1.1

package:
  name: "mojo-tls"
  version: ${{ version }}

source:
  - path: .

build:
  number: 0
  script:
    - mojo precompile src/tls -I ${{ PREFIX }}/lib/mojo -o ${{ PREFIX }}/lib/mojo/tls.mojoc

requirements:
  host:
    - mojo-compiler >=1.2.0,<1.3
    - mojo-aio
  build:
    - mojo-compiler >=1.2.0,<1.3
  run:
    - ${{ pin_compatible('mojo-compiler', upper_bound='x.x') }}
    - mojo-aio  # .mojoc loads only on the minor it was built with

tests:
  - script:
    - if: unix
      then:
        - mojo build -I src examples/client.mojo -o client
        - mojo build -I src examples/server.mojo -o server
    files:
      source:
        - src/
        - examples/

about:
  homepage: https://github.com/amarbaro/mojo-tls
  license: Apache-2.0
  license_file: LICENSE
  summary: TLS 1.3 and 1.2 client and server for Mojo, with X.509, in pure Mojo
  repository: https://github.com/amarbaro/mojo-tls

extra:
  maintainers:
    - amarbaro.org
  project_name:
    - mojo-tls
